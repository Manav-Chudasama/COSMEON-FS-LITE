name: CI

on:
  push:
    branches: [main, features]
  pull_request:
    branches: [main, features]

jobs:
  lint-type-test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint (Biome)
        run: bun run lint

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Unit Tests
        run: bun test tests/unit/
