# ============================================
# COSMEON FS-LITE — Docker Compose
# ============================================
# Usage:
#   docker compose up --build        # Start all services
#   docker compose down               # Stop all services
# ============================================

services:
  # ── MongoDB (Local Database) ──
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fs-net

  # ── Orchestrator (Next.js Dashboard) ──
  orchestrator:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - STORAGE_MODE=docker
      - MONGODB_URI=mongodb://mongo:27017/fslite
      - NODE_HOSTS=node-1:4000,node-2:4000,node-3:4000,node-4:4000,node-5:4000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_healthy
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy
      node-3:
        condition: service_healthy
      node-4:
        condition: service_healthy
      node-5:
        condition: service_healthy
    networks:
      - fs-net

  # ── Storage Nodes ──
  node-1:
    build: ./node-service
    container_name: fs-lite-node-1
    environment:
      - NODE_NAME=ORBIT-1
      - PORT=4000
    volumes:
      - node1_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - fs-net

  node-2:
    build: ./node-service
    container_name: fs-lite-node-2
    environment:
      - NODE_NAME=ORBIT-2
      - PORT=4000
    volumes:
      - node2_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - fs-net

  node-3:
    build: ./node-service
    container_name: fs-lite-node-3
    environment:
      - NODE_NAME=ORBIT-3
      - PORT=4000
    volumes:
      - node3_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - fs-net

  node-4:
    build: ./node-service
    container_name: fs-lite-node-4
    environment:
      - NODE_NAME=ORBIT-4
      - PORT=4000
    volumes:
      - node4_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - fs-net

  node-5:
    build: ./node-service
    container_name: fs-lite-node-5
    environment:
      - NODE_NAME=ORBIT-5
      - PORT=4000
    volumes:
      - node5_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - fs-net

volumes:
  mongo_data:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data:

networks:
  fs-net:
    driver: bridge
